<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>teclado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body style="background-color: #160828; color: white;">

    <div id="scroll-progress-container" class="fixed top-0 left-0 w-full h-1.5 z-[100] bg-black/60 pointer-events-none">
    <div id="scroll-progress-bar" class="h-full bg-gradient-to-r from-pink-500 via-cyan-400 to-pink-500 w-0 transition-all duration-75 shadow-[0_0_12px_#00f0ff]"></div>
    </div>

    <!-- Barra de navegación -->
    <header
        class="navbar navbar-expand-lg fixed-top"
        data-bs-theme="dark"
        style="background-color: #210C3A;"
    >

        <div class="container-fluid px-4">

            <!-- Logo -->
            <a class="navbar-brand fw-bold text-white" href="#inicio">
              TECLADO
            </a>

            <!-- Boton  moviles -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu de navegacion -->
            <nav class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="#por-dentro">
                            Por dentro
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#switches">
                            Switches
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#specs">
                            Specs
                        </a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a
                            class="btn btn-warning rounded-pill px-4"
                            href="#inicio"
                        >
                            Inicio
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <div id="scroll-progress-container">
    <div id="scroll-progress-bar"></div>
    </div>
    <main >

    

    

        <section id="inicio" class="hero">
            <video autoplay muted loop playsinline>
                <source src="extra/video/🟪🎶 Neon Purple Grid Retrowave 80s Sci fi VJ Loop Video Background for Edits.mp4">
            </video>

            <div class="contenido">

            <!-- TÍTULO PRINCIPAL -->
            <h1 class="hero__title">
                TECLADO
            </h1>

            <!-- TECLADO INTERACTIVO -->
            <div class="teclado-contenedor">

                <div id="teclado-interactivo"
                    class="teclado-interactivo"
                    role="group"
                    aria-label="Teclado KEYWAVE interactivo">

                    <!-- JavaScript genera aquí las teclas -->

                </div>

            </div>

</div>
            
           
        </section>

        <section id="por-dentro" class="min-vh-100">
            <h2>Por dentro</h2>
        </section>

        
<!-- SECCIÓN SWITCHES -->
        <section id="switches" class="switches-section py-5">

            <div class="container py-5">

                <!-- Título -->
                <div class="text-center mb-5">

                    <p class="switch-subtitulo">
                        // LABORATORIO DE ACÚSTICA
                    </p>

                    <h2 class="fw-bold text-white">
                        SELECCIONA TU SWITCH
                    </h2>

                    <p class="text-secondary">
                        Prueba los diferentes perfiles de sonido.
                    </p>

                </div>

                <!-- Tarjetas de switches -->
                <div class="row g-4">

                    <!-- SWITCH 1: TÁCTIL -->
                    <div class="col-12 col-md-4">

                        <button type="button"
                                class="switch-card activo"
                                data-switch="tactile"
                                aria-pressed="true">

                            <h3 class="switch-violet">
                                Neon Violet
                            </h3>

                            <p class="switch-tipo">
                                Tactile Clicky
                            </p>

                            <p>
                                Sonido nítido y respuesta táctil
                                marcada. Ideal para programación.
                            </p>

                            <hr>

                            <p>Fuerza: 55g</p>
                            <p>Sonido: Sharp Click</p>

                        </button>

                    </div>

                    <!-- SWITCH 2: LINEAL -->
                    <div class="col-12 col-md-4">

                        <button type="button"
                                class="switch-card"
                                data-switch="linear"
                                aria-pressed="false">

                            <h3 class="switch-blue">
                                Plasma Blue
                            </h3>

                            <p class="switch-tipo">
                                Linear Fast
                            </p>

                            <p>
                                Pulsación ultrasuave sin bache
                                táctil. Diseñado para gaming.
                            </p>

                            <hr>

                            <p>Fuerza: 45g</p>
                            <p>Sonido: Clack Suave</p>

                        </button>

                    </div>

                    <!-- SWITCH 3: SILENCIOSO -->
                    <div class="col-12 col-md-4">

                        <button type="button"
                                class="switch-card"
                                data-switch="silent"
                                aria-pressed="false">

                            <h3 class="switch-yellow">
                                Cyber Yellow
                            </h3>

                            <p class="switch-tipo">
                                Silent Thock
                            </p>

                            <p>
                                Switch lineal amortiguado.
                                Sonido profundo y suave.
                            </p>

                            <hr>

                            <p>Fuerza: 50g</p>
                            <p>Sonido: Deep Thock</p>

                        </button>

                    </div>

                </div>


                <!-- SWITCH SELECCIONADO -->
                <div class="text-center mt-4">

                    <p id="switch-estado" class="text-white">
                        Seleccionado: Neon Violet
                    </p>

                </div>

            </div>

        </section>


        <section id="specs" class="min-vh-100">
            <h2>Especificaciones</h2>
        </section>

        <section id="reservar" class="min-vh-100">
            <h2>Reserva tu teclado</h2>
        </section>

    </main>



    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
